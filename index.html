<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Sphere</title>
    <!-- 검색 결과에서 제목 아래 보이는 사이트 설명. SPA라 모든 경로에 같은 문구가 붙는다. -->
    <meta
      name="description"
      content="유용한 아티클과 리소스 링크를 공유하고, 다른 사람이 모은 링크를 발견하는 소셜 플랫폼이에요."
    />

    <!-- CloudWatch RUM: 실사용자 성능·에러 지표 수집. App Monitor는 Cognito identity pool
         없이 리소스 기반 정책(Principal: "*", rum:PutRumEvents)으로 익명 수집을 허용한다.
         signing:false는 그 구성과 짝을 이룬다 - CloudWatch RUM 리소스 정책 문서는 퍼블릭
         정책을 쓰면 권한 부여 설정을 건너뛸 수 있다고 안내하지만, aws-rum-web 일반 설정
         가이드는 signing:false를 "인증되지 않은 프록시" 시나리오로 한정해 설명해 다소
         엇갈렸다 - 로컬(도메인 불일치 400)과 프로덕션(200 OK + CloudWatch 메트릭 실측)
         양쪽으로 검증해 해소했다(2026-09-26). 전체 구조·운영 파라미터·시행착오는
         docs/RUM.md 참고. 스크립트는 head 최상단 가까이 둬야 타이밍 측정이 정확하다
         (AWS 공식 설치 가이드). -->
    <script>
      (function (n, i, v, r, s, c, x, z) {
        x = window.AwsRumClient = { q: [], n: n, i: i, v: v, r: r, c: c };
        window[n] = function (c, p) {
          x.q.push({ c: c, p: p });
        };
        z = document.createElement('script');
        z.async = true;
        z.src = s;
        document.head.insertBefore(z, document.head.getElementsByTagName('script')[0]);
      })(
        'cwr',
        '81cbaae5-b6f2-48d9-9c05-f6f6f5f648cc',
        '1.0.0',
        'ap-northeast-1',
        'https://client.rum.us-east-1.amazonaws.com/3.x/cwr.js',
        {
          sessionSampleRate: 1,
          endpoint: 'https://dataplane.rum.ap-northeast-1.amazonaws.com',
          telemetries: ['errors', 'performance'],
          allowCookies: true,
          enableXRay: false,
          signing: false,
        }
      );
    </script>

    <!-- Pretendard 공식 dynamic subset(가변 폰트 + unicode-range 분할) — 화면에 쓰인 글자
         만큼만 받아온다. 아래 preload는 공개 페이지(/post·상세·로그인·회원가입 × 데스크톱·모바일)
         8개 조합이 모두 쓰는 조각 87~91번뿐이다. preload를 다 빼면 이 조각들을 CSS를 읽은 뒤에야
         받아 시뮬레이션 측정에서 FCP가 늦어졌고, 게시글 글자 합집합으로 고른 19개를 preload하면
         첫 화면에 안 쓰는 조각까지 대역폭을 나눠 써 모바일 LCP가 1.5~2.1초 더 걸렸다(2026-10-27
         직접 측정). 목록을 다시 정하는 절차는 docs/PERFORMANCE.md "폰트 preload 유지보수" 절 참고. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.87.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.88.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.89.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.90.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.91.woff2"
    />
    <link rel="stylesheet" href="/fonts/pretendard-1.3.9/pretendard-dynamic-subset.css" />

    <link rel="icon" href="/favicons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/favicons/site.webmanifest" />

    <!-- 테마 FOUC 방지: next-themes의 ThemeScript는 React 렌더 중 삽입돼 SPA에선 첫 페인트
         전에 못 돈다. 아래 키는 STORAGE_KEYS.THEME(src/shared/config/storage-keys.ts:31)과
         같은 값을 유지해야 한다 - storage-keys.test.ts가 이 일치를 검사한다. -->
    <script>
      try {
        var stored = localStorage.getItem('linksphere:theme') || 'system';
        var isDark =
          stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* localStorage 차단 환경(사파리 프라이빗 등)에서는 기본 테마로 둔다 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
