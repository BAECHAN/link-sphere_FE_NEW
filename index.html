<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Sphere</title>

    <!-- Pretendard 공식 dynamic subset(가변 폰트 + unicode-range 분할) — 화면에 쓰인 글자
         만큼만 받아온다. preload 없이 이 링크 하나로 충분하다(당근마켓·마켓컬리 프로덕션
         실측 결과, 2026-09-26 — 두 곳 모두 폰트 preload를 쓰지 않는다). 상세 근거는
         docs/plans/2026-09-25-lighthouse-perf.md 참고. -->
    <link rel="stylesheet" href="/fonts/web/variable/pretendard-dynamic-subset.css" />

    <link rel="icon" href="/favicons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/favicons/site.webmanifest" />

    <!-- 테마 FOUC 방지: next-themes의 ThemeScript는 React 렌더 중 삽입돼 SPA에선 첫 페인트
         전에 못 돈다. 아래 키는 STORAGE_KEYS.THEME(src/shared/config/storage-keys.ts:31)과
         같은 값을 유지해야 한다 - storage-keys.test.ts가 이 일치를 검사한다. -->
    <script>
      try {
        var stored = localStorage.getItem('linksphere:theme') || 'system';
        var isDark =
          stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* localStorage 차단 환경(사파리 프라이빗 등)에서는 기본 테마로 둔다 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
