name: Storybook Deploy (S3 + CloudFront)

# shared/ui 43개 컴포넌트가 이미 Storybook 스토리 100%(153개 케이스)를 갖췄지만
# 지금까지는 배포 워크플로가 없어 로컬 `pnpm storybook`으로만 볼 수 있었다. 이
# 워크플로는 같은 S3 버킷의 storybook/ 접두사에 정적 빌드를 올려 공개 URL을 만든다.
#
# deploy.yml과 별도 파일로 분리한 이유: paths 필터는 워크플로 단위라, deploy.yml에
# job으로 얹으면 .storybook/** 변경만으로도 프로덕션 배포 + 앱 캐시 전역(/*) 무효화가
# 함께 돈다. 상세 배경은 docs/DEPLOY.md "Storybook 공개 배포" 절 참고.
on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'public/**'
      - '.storybook/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

concurrency:
  # S3 sync 도중 취소하면 일부 파일만 갱신된 상태로 남으므로 취소하지 않고 순서대로 처리한다.
  group: deploy-storybook
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        # Firebase 시크릿은 주입하지 않는다 - 공개 산출물이고 shared/ui 스토리는
        # firebase 모듈을 import하지 않는다.
        run: pnpm build-storybook

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Upload to S3
        run: |
          DEST="s3://${{ secrets.S3_BUCKET_NAME }}/storybook"

          # 해시 없는 진입점 - 항상 최신 버전을 받도록 캐시 비활성화
          aws s3 cp storybook-static/index.html "$DEST/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
          aws s3 cp storybook-static/iframe.html "$DEST/iframe.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          # 콘텐츠 해시가 붙은 번들 - 장기 캐시
          aws s3 sync storybook-static/assets/ "$DEST/assets/" --delete \
            --cache-control "public, max-age=31536000, immutable"

          # Pretendard 정적 서브셋 - 앱과 동일 정책
          aws s3 sync storybook-static/fonts/ "$DEST/fonts/" --delete \
            --cache-control "public, max-age=31536000, immutable"

          # 그 외(sb-manager, sb-addons, sb-common-assets, favicons, index.json 등)
          # - 파일명에 해시가 없어 immutable을 주면 안 되므로 짧은 캐시로 서빙한다.
          # --delete는 storybook/ 접두사 범위로 한정되므로 앱 객체(dist/)에는 영향이 없다.
          aws s3 sync storybook-static/ "$DEST" --delete \
            --cache-control "public, max-age=300" \
            --exclude "index.html" \
            --exclude "iframe.html" \
            --exclude "assets/*" \
            --exclude "fonts/*"

      - name: CloudFront Invalidation
        # /storybook/* 로 한정한다 - /*를 쓰면 앱의 엣지 캐시까지 비워 실사용자
        # 지연과 오리진 요청 급증을 유발한다. 스토리 수정 때문에 앱 성능을 깎을 이유가 없다.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/storybook/*"
