name: Storybook Deploy (GitHub Pages)

# 컴포넌트 스토리(shared/ui 컴포넌트 + Provider 없이 렌더되는 일부 entities·widgets, 범위 기준은
# docs/FE-ARCHITECTURE.md §18)를 정적 빌드로 이 저장소의 GitHub Pages(https://baechan.github.io/link-sphere_FE_NEW/storybook/)에
# 올려 공개 URL을 만든다. 이 워크플로가 생기기 전에는 로컬 `pnpm storybook`으로만 볼 수 있었다.
# 사이트 루트는 pages-site/(첫 화면, 지금은 storybook/으로 넘김)이고 문서마다 하위 경로를 쓴다.
#
# 운영 도메인(linksphere.click)이 아니라 github.io에 올리는 이유: 같은 출처에서 도는 스크립트는 refresh 쿠키를
# 붙여 /api/auth/refresh를 부를 수 있어, 앱이 아닌 코드(Storybook과 그 의존성)를 그 출처에 두지 않는다.
# 2026-10-30까지는 같은 S3 버킷의 storybook/ 접두사에 올렸다(docs/DECISIONS.md 2026-10-30 항목).
#
# deploy.yml과 별도 파일로 분리한 이유: paths 필터는 워크플로 단위라, deploy.yml에
# job으로 얹으면 .storybook/** 변경만으로도 프로덕션 배포가 함께 돈다.
# 상세 배경은 docs/DEPLOY.md "Storybook 공개 배포" 절 참고.
on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'public/**'
      - '.storybook/**'
      - 'pages-site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

concurrency:
  # GitHub 공식 Pages 예제(actions/starter-workflows pages/static.yml)와 같다 - 진행 중인 게시를 취소하지 않고
  # 순서대로 처리한다.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write # Pages 게시
  id-token: write # deploy-pages가 게시 요청을 OIDC 토큰으로 증명한다

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 저장소 Pages 소스가 "GitHub Actions"일 때 쓰는 환경 - main만 배포하도록 보호 규칙을 건다(docs/DEPLOY.md)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        # Firebase 시크릿은 주입하지 않는다 - 공개 산출물이고 shared/ui 스토리는
        # firebase 모듈을 import하지 않는다.
        run: pnpm build-storybook

      # Pages는 배포마다 사이트 전체를 바꾼다(actions/deploy-pages#50) - 이 사이트에 다른 문서를 더할 때도 다른
      # 워크플로로 따로 올리지 말고 여기서 함께 만들어 자기 하위 경로에 넣는다.
      - name: 사이트 조립
        run: |
          mkdir -p _site
          cp -R pages-site/. _site/
          mv storybook-static _site/storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
