name: Frontend Deploy (S3 + CloudFront)

on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'index.html'
      - 'tsconfig*.json'
      - 'scripts/inject-csp.js'
      - 'scripts/prune-old-assets.js'
      - 'scripts/lib/prune-assets.js'
      # 자기 파일이 바뀌면(Dependabot의 액션 버전 갱신 포함) 바로 한 번 돌려 확인한다 -
      # 안 그러면 다음 실제 배포 때까지 아무도 실행해 보지 않는다(deploy-storybook.yml과 같은 방식).
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC 인증을 위해 필수입니다.
  contents: read

# main에 연달아 push되면 아래 검증 스텝이 오래된 run의 sha와 방금 다른 run이 올린 라이브
# 상태를 비교해 성공한 배포를 실패로 오판할 수 있다. cancel-in-progress는 false로 둔다 -
# ci.yml과 달리 이 워크플로는 aws s3 sync --delete 도중이라 취소하면 버킷이 반쯤 지워진
# 채로 남을 수 있다(취소가 아니라 대기열).
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check, lint & format check
        run: pnpm check

      - name: Run tests
        run: pnpm test
        env:
          VITE_API_BASE_URL: http://localhost

      - name: Build
        # Vite 빌드 시 백엔드 주소 등 환경변수가 필요하면 여기서 주입합니다.
        run: pnpm build
        env:
          # Firebase (FCM 푸시 알림) — GitHub Repository Secrets에서 관리
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # 영구 키 대신 GitHub OIDC 토큰으로 역할을 맡아 이 job 동안만 쓰는 임시 자격증명을 받는다.
          # 역할은 이 레포의 main 브랜치 job만 맡을 수 있다(신뢰 정책, docs/DEPLOY.md "AWS IAM 권한 요구사항").
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Upload to S3
        # 순서가 곧 원자성이다 - HTML이 가리키는 파일은 HTML보다 먼저 S3에 있어야 한다.
        # 예전엔 index.html을 맨 먼저 올려, 새 HTML이 아직 없는 entry 청크를 가리키는 공백이
        # 생겼다(2026-10-14 run 38515585972 실측 21.6초 - 그 사이 새 방문자는 청크 403으로
        # 흰 화면). CloudFront 최소 TTL이 1초라 엣지는 이 공백 동안에도 S3의 새 HTML을 바로
        # 가져간다. 그래서 해시 자산 → 그 외 파일 → HTML → version.json 순서로 올린다.
        run: |
          # assets (hash 포함) — 장기 캐시, 구 파일 유지 (접속 중 유저가 구 청크 요청 가능)
          aws s3 sync dist/assets/ s3://${{ secrets.S3_BUCKET_NAME }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"
          # fonts — 파일명에 해시가 없는 대신 경로에 폰트 버전이 들어간다(public/fonts/pretendard-1.3.9/).
          # 폰트를 바꿀 땐 파일을 덮어쓰지 말고 디렉터리 버전을 올린다 - 같은 경로면 1년 캐시 때문에
          # 브라우저가 옛 폰트를 계속 쓴다. 경로가 내용을 대표하니 --size-only로 매 배포 재업로드를 건너뛴다
          # (지금 빌드에 있는 파일은 업로드 시각이 오래돼도 옛 자산 정리가 지우지 않는다).
          aws s3 sync dist/fonts/ s3://${{ secrets.S3_BUCKET_NAME }}/fonts/ --size-only \
            --cache-control "public, max-age=31536000, immutable"
          # 그 외 파일 (favicon, manifest 등) — 최신 유지. 이 sync는 --delete라
          # 버킷 안의 dist/에 없는 객체를 전부 지운다 - storybook/*는 별도
          # 워크플로(deploy-storybook.yml)가 같은 버킷의 storybook/ 접두사에
          # 올리므로, 여기서 제외하지 않으면 FE 배포가 돌 때마다 방금 배포한
          # Storybook이 통째로 삭제된다.
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete \
            --exclude "index.html" \
            --exclude "404.html" \
            --exclude "firebase-messaging-sw.js" \
            --exclude "version.json" \
            --exclude "assets/*" \
            --exclude "fonts/*" \
            --exclude "storybook" \
            --exclude "storybook/*"
          # Service Worker — 캐시 없이 서빙 (브라우저가 항상 최신 버전 체크)
          aws s3 cp dist/firebase-messaging-sw.js s3://${{ secrets.S3_BUCKET_NAME }}/firebase-messaging-sw.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/javascript"
          # index.html — 항상 최신 버전을 받도록 캐시 비활성화. 이 업로드부터 새 버전이 공개된다
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
          # 404.html — index.html 사본. CloudFront Function(spa-fallback.js)이 앱 라우트가 아닌
          # 경로를 이 파일로 보내고 spa-status.js가 상태만 404로 바꾼다. 내용이 index.html과
          # 같아야 해서(같은 entry 청크) 같은 캐시 정책으로 매 배포마다 다시 올린다.
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/404.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
          # 배포 식별자 — index.html과 같은 이유로 캐시 비활성화(배포 반영 확인용). "배포 완료"
          # 신호라 맨 마지막에 올린다 - 아래 검증 스텝 1)이 이 sha가 바뀌기를 기다린다
          aws s3 cp dist/version.json s3://${{ secrets.S3_BUCKET_NAME }}/version.json \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

      - name: CloudFront Invalidation
        # 새 파일이 반영되도록 캐시를 무효화합니다.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: 배포 반영 검증
        # push 성공과 실제 배포 완료는 다른 사건이다(.claude/CLAUDE.md Critical Rule) -
        # 실제 CloudFront를 때려서 이번 커밋이 반영됐는지 직접 확인한다.
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://linksphere.click' }}
        run: |
          set -euo pipefail

          LOCAL_ENTRY=$(grep -o 'assets/js/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "로컬 entry: $LOCAL_ENTRY / 기대 sha: $GITHUB_SHA"

          # 1) /version.json 의 sha 가 이번 커밋인가 - 전파 지연을 감안해 최대 2분 재시도
          LIVE_SHA=""
          for i in $(seq 1 12); do
            LIVE_SHA=$(curl -fsS "$SITE_URL/version.json" | jq -r '.sha' || echo "")
            if [ "$LIVE_SHA" = "$GITHUB_SHA" ]; then
              break
            fi
            echo "($i/12) 라이브 sha=$LIVE_SHA — 10초 후 재시도"
            sleep 10
          done
          if [ "$LIVE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::version.json sha 불일치: live=$LIVE_SHA expected=$GITHUB_SHA"
            exit 1
          fi

          # 2) index.html 캐시 헤더 회귀 - no-store 가 깨지면 NEW-VERSION-RELOAD 전제가 무너진다
          CC=$(curl -fsSI "$SITE_URL/index.html" | tr -d '\r' | grep -i '^cache-control:' || echo "")
          case "$CC" in
            *no-store*) echo "cache-control OK: $CC" ;;
            *)
              echo "::error::index.html cache-control 에 no-store 없음: '$CC'"
              exit 1
              ;;
          esac

          # 3) 라이브 index.html 의 entry 해시가 방금 빌드한 것과 같은가 (부분 배포 감지)
          LIVE_ENTRY=$(curl -fsS "$SITE_URL/index.html" | grep -o 'assets/js/index-[A-Za-z0-9_-]*\.js' | head -1)
          if [ "$LIVE_ENTRY" != "$LOCAL_ENTRY" ]; then
            echo "::error::entry 청크 불일치: live=$LIVE_ENTRY local=$LOCAL_ENTRY"
            exit 1
          fi

          # 4) 404.html(없는 경로에 쓰는 index.html 사본)도 같은 entry 해시인가 - 어긋나면
          #    없는 경로에서 옛 청크를 불러 화면이 깨진다. Function이 상태를 404로 바꾸므로 -f 없이 받는다.
          NOT_FOUND_ENTRY=$(curl -sS "$SITE_URL/404.html" | grep -o 'assets/js/index-[A-Za-z0-9_-]*\.js' | head -1)
          if [ "$NOT_FOUND_ENTRY" != "$LOCAL_ENTRY" ]; then
            echo "::error::404.html entry 청크 불일치: live=$NOT_FOUND_ENTRY local=$LOCAL_ENTRY"
            exit 1
          fi

          echo "배포 반영 검증 통과: sha=$LIVE_SHA entry=$LIVE_ENTRY"

      - name: 옛 자산 정리
        # 열린 탭을 위해 옛 해시 청크를 지우지 않는 대신(위 Upload 스텝), 지금 빌드에 없고 마지막
        # 업로드가 7일 넘은 assets/·fonts/만 지운다 - 무기한 쌓이지 않게(docs/DEPLOY.md 9번).
        # 배포 반영 검증이 통과한 뒤에만 돈다(앞 스텝이 실패하면 건너뛴다). 정리는 부수 작업이라
        # 실패해도 배포 run을 실패로 만들지 않는다(실패 이슈가 열리지 않게) - 경고 주석만 남긴다.
        run: node scripts/prune-old-assets.js --bucket "${{ secrets.S3_BUCKET_NAME }}" || echo "::warning::옛 자산 정리 실패 - 사이트 배포는 끝났다. 이 스텝 로그 확인"

  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 배포 실패 이슈 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "배포 실패: ${GITHUB_SHA:0:7} (run #${{ github.run_number }})" \
            --body "$(printf '커밋: %s\n실행 로그: %s\n\n확인 순서는 docs/DEPLOY.md 의 "배포 반영 검증하는 법" 절 참고.' "$GITHUB_SHA" "$RUN_URL")"

  # notify-failure가 만든 이슈는 닫는 경로가 없어, 원인을 고친 뒤에도 열린 채 남았다(#136, 22일).
  # 성공한 배포가 "main이 배포 안 된 상태"를 해소하는 신호이므로 그때 닫는다. 이 job이 실패해도
  # 배포 run 결론은 deploy job을 따르게 continue-on-error를 둔다 - job 단위 continue-on-error는
  # "job이 실패해도 workflow run이 실패하지 않게 한다"(번역, https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idcontinue-on-error).
  close-resolved-failures:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
    steps:
      - name: 해결된 배포 실패 이슈 닫기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "github-actions[bot]" \
            --json number,title --jq '.[] | select(.title | startswith("배포 실패: ")) | .number' |
          while read -r number; do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "$(printf '후속 배포 성공으로 자동 종료: 커밋 %s\n실행 로그: %s\n\n원인을 고친 PR 없이 재시도만으로 통과했다면 실패 run 로그를 확인하고 다시 열 것.' "$GITHUB_SHA" "$RUN_URL")"
          done
