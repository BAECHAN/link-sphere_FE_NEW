name: Gemini History Updater
on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'index.html'
      - 'tsconfig*.json'
  # BE 레포(history-dispatch.yml)가 자기 커밋 로그를 계산해서 보내는 이벤트.
  # BE 레포를 체크아웃할 필요 없이 client_payload.logs를 그대로 사용한다.
  repository_dispatch:
    types: [be-history-update]

jobs:
  update:
    runs-on: ubuntu-latest
    # main 규칙셋은 필수 체크(check·e2e)를 요구하고 사람에게는 예외가 없다. 이 봇의 커밋은 CI를
    # 거치지 않으므로 규칙셋 예외로 등록된 사용자 소유 GitHub App(link-sphere-history-bot)의
    # 설치 토큰으로 push한다 - 기본 GITHUB_TOKEN은 개인 계정 레포에서 규칙셋 예외로 등록할 수 없다
    # (2026-10-13 실측, HTTP 422). 앱 키 관리는 docs/DEPLOY.md "환경 변수 및 Secrets 설정" 참고.
    # 커밋 메시지의 [skip ci]가 그대로라 앱 토큰 push가 다른 워크플로를 연쇄로 돌리지 않는다.
    permissions:
      contents: read
    steps:
      - name: 히스토리 앱 토큰 받기
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HISTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
      # 배포와 무관한 부가 작업이므로 실패해도 워크플로 전체를 실패로 만들지 않는다
      - run: node scripts/generate-history.js
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          # repository_dispatch(BE)면 이미 계산된 로그를 그대로 쓰고, push(FE)면 비어서
          # 스크립트가 기존처럼 BEFORE_SHA/CURRENT_SHA로 직접 git log를 계산한다.
          PRECOMPUTED_LOGS: ${{ github.event.client_payload.logs }}
          SOURCE_LABEL: ${{ github.event.client_payload.source || 'FE' }}
          HISTORY_ENTRY_FILE: ${{ runner.temp }}/history-entry.md
      # 실행 중(약 30초) main에 다른 PR 병합이나 다른 히스토리 실행이 끼어들면 push가 거절된다
      # (2026-10-12 #338 유실). 그때 최신 main을 다시 받아 같은 항목을 맨 위에 다시 붙여 재시도한다.
      - name: Commit & Push
        env:
          ENTRY_FILE: ${{ runner.temp }}/history-entry.md
          SOURCE_LABEL: ${{ github.event.client_payload.source || 'FE' }}
        run: |
          if [ ! -s "$ENTRY_FILE" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git config --local user.name "Gemini-Bot"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            cat "$ENTRY_FILE" docs/HISTORY.md > "$RUNNER_TEMP/HISTORY.md"
            mv "$RUNNER_TEMP/HISTORY.md" docs/HISTORY.md
            git commit -m "docs: auto-update history by Gemini ($SOURCE_LABEL) [skip ci]" -- docs/HISTORY.md

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "push 거절(시도 $attempt/5) — 최신 main 위에서 다시 시도"
              sleep $((attempt * 5))
            fi
          done

          echo "::error::push가 5회 모두 거절돼 HISTORY.md 갱신을 반영하지 못했다"
          exit 1
