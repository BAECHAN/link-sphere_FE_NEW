name: CI

# PR에 대해 type-check·lint·format·test·문서 참조 정합성을 검증한다. 지금까지는
# deploy.yml(push:main)만 있어서 PR 단계에서 검사가 전혀 안 됐고, pnpm check(lint+format)는
# 사람이 수동으로 돌릴 때만 실행돼서 .claude/worktrees/ 안의 빌드 산출물이 몇 달치 안 걸리고
# 쌓이는 걸 아무도 몰랐다. 문서 참조 검사(check:docs)도 같은 이유로 추가했다 — docs/TESTING.md가
# 폐기된 레이어를 한 달 넘게 정본처럼 서술하고 있던 걸 사람이 우연히 발견하기 전까진 아무도
# 몰랐다(2026-09-07, docs/CI-CHECK-GATE.md 참고).
on:
  # base 브랜치 필터를 두지 않는다 - 예전엔 branches: ['main']이라 PR의 base가
  # main이 아닌 스택 PR(다른 PR 브랜치를 base로 하는 PR)에서 이 워크플로 자체가
  # 트리거되지 않았다. 실제로 PR #109(타이포그래피 역할 토큰)가 PR #108의 브랜치를
  # base로 열려 있는 동안 자동 CI가 0건이었고 workflow_dispatch로 수동 확인해야
  # 했다(2026-09-16 실측). "docs/plans 불변성 확인" 스텝은
  # 이미 github.base_ref를 동적으로 참조하므로 이 필터 제거로 영향받지 않는다.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docs/plans 불변성 확인
        # docs/plans/*.md는 plan mode 계획의 스냅샷이라 커밋된 뒤 수정하지 않는다
        # (append-only, ADR·DB 마이그레이션 파일과 같은 컨벤션). 이탈은 새 파일이 아니라
        # PR 본문의 "## 계획 대비 구현" 섹션에 적는다.
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- docs/plans/ \
            | awk '$1 == "M" { print $2 }')
          if [ -n "$changed" ]; then
            echo "docs/plans/ 파일은 커밋된 뒤 수정하지 않습니다(append-only, ADR과 같은 규칙)."
            echo "이탈은 새 파일이 아니라 PR 본문의 '## 계획 대비 구현' 섹션에 적으세요."
            echo "$changed"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check, lint & format check
        run: pnpm check

      - name: Run tests
        run: pnpm test
        env:
          VITE_API_BASE_URL: http://localhost

      - name: Check docs
        run: pnpm check:docs

      - name: Build
        # globals.css의 @theme 토큰이 실제 CSS로 정상 생성되는지 머지 전에 확인한다.
        # 지금까지는 이 확인을 로컬에서 pnpm build 후 dist CSS를 수동 grep하는
        # 방식으로만 해왔다(docs/DESIGN-SYSTEM.md §9 참고) - CI 게이트가 없었다.
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Run Storybook a11y tests
        # addon-vitest가 storybookScript(vitest.config.ts)로 Storybook 서버를
        # 직접 띄우므로 별도 기동 스텝이 필요 없다. 이 job이 이미 설치한
        # Playwright 브라우저(위 스텝)를 그대로 재사용한다 - 새 job으로 분리하면
        # 브라우저 설치가 중복된다.
        run: pnpm test:storybook

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
