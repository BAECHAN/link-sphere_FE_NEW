name: CI

# PR에 대해 type-check·lint·format·test·문서 참조 정합성을 검증한다. 지금까지는
# deploy.yml(push:main)만 있어서 PR 단계에서 검사가 전혀 안 됐고, pnpm check(lint+format)는
# 사람이 수동으로 돌릴 때만 실행돼서 .claude/worktrees/ 안의 빌드 산출물이 몇 달치 안 걸리고
# 쌓이는 걸 아무도 몰랐다. 문서 참조 검사(check:docs)도 같은 이유로 추가했다 — docs/TESTING.md가
# 폐기된 레이어를 한 달 넘게 정본처럼 서술하고 있던 걸 사람이 우연히 발견하기 전까진 아무도
# 몰랐다(2026-09-07, docs/CI-CHECK-GATE.md 참고).
on:
  # base 브랜치 필터를 두지 않는다 - 예전엔 branches: ['main']이라 PR의 base가
  # main이 아닌 스택 PR(다른 PR 브랜치를 base로 하는 PR)에서 이 워크플로 자체가
  # 트리거되지 않았다. 실제로 PR #109(타이포그래피 역할 토큰)가 PR #108의 브랜치를
  # base로 열려 있는 동안 자동 CI가 0건이었고 workflow_dispatch로 수동 확인해야
  # 했다(2026-09-16 실측). "docs/plans 불변성 확인" 스텝은
  # 이미 github.base_ref를 동적으로 참조하므로 이 필터 제거로 영향받지 않는다.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # pull-requests: write는 "PR 영향 그래프" 스텝이 PR 댓글을 달고 갱신하는 데 필요하다
    # (https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens).
    # 잡에 permissions를 적으면 나머지 권한은 none이 되므로 checkout용 contents: read도 함께 적는다.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 이 잡은 저장소의 테스트를 실행하고 PR 쓰기 토큰을 받는다. 뒤 스텝이 git 인증을 쓰지 않으니
          # 토큰을 파일로 남기지 않는다(docs/plans/2026-11-06-mutation-loop-l2.md).
          persist-credentials: false

      - name: docs/plans 불변성 확인
        # docs/plans/*.md는 plan mode 계획의 스냅샷이라 커밋된 뒤 원문을 고치지 않는다(append-only).
        # 예외는 H1 아래 "구현 결과" 블록(<!-- plan-result:start --> ~ <!-- plan-result:end -->) 하나다 -
        # 이탈·미구현·계획에 없던 변경과 나중의 "대체됨"을 계획 파일 안에 남기려고 병합 뒤에도 고칠 수
        # 있게 했다(docs/plans/2026-11-03-plan-result-block.md). merge-base 판과 HEAD 판에서 블록과
        # 빈 줄을 지운 나머지가 같은지 본다. 빈 줄을 빼는 건 블록을 넣고 뺄 때 앞뒤 빈 줄이 남기 때문이다.
        # 지우거나(D) 이름을 바꾼(R) 계획 파일도 막는다 - 2026-11-12 전에는 고친 파일(M)만 봐서, revert PR이
        # 계획을 지워도 통과했다(docs/DEPLOY.md "앱 배포 되돌리기"의 #596 시험).
        # workflow_dispatch처럼 base_ref가 없으면 비교할 base가 없어 건너뛴다.
        run: |
          if [ -z "${{ github.base_ref }}" ]; then
            echo "PR이 아니라 건너뜁니다."
            exit 0
          fi

          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          strip_result() { awk '/^<!-- plan-result:start/ { skip = 1 } !skip && NF { print } /^<!-- plan-result:end -->/ { skip = 0 }'; }
          changed=""
          removed=""

          # 이름 바꿈(R)은 옛 경로가 둘째 칸이라 그 경로를 지운 것으로 알린다
          while IFS=$'\t' read -r status path _; do
            case "$status" in
              M)
                if ! diff -q <(git show "$base:$path" | strip_result) <(git show "HEAD:$path" | strip_result) > /dev/null; then
                  changed="$changed$path"$'\n'
                fi
                ;;
              D | R*)
                removed="$removed$path"$'\n'
                ;;
            esac
          done < <(git diff --name-status "$base" HEAD -- docs/plans/)

          if [ -n "$changed" ]; then
            echo "docs/plans/ 계획 원문은 커밋된 뒤 수정하지 않습니다(append-only, ADR과 같은 규칙)."
            echo "고칠 수 있는 건 H1 아래 '구현 결과' 블록(<!-- plan-result:start --> ~ <!-- plan-result:end -->)뿐입니다."
            printf '%s' "$changed"
          fi

          if [ -n "$removed" ]; then
            echo "docs/plans/ 계획 파일은 커밋된 뒤 지우거나 이름을 바꾸지 않습니다."
            echo "되살리려면: git restore --source=$base --staged --worktree -- <파일>"
            printf '%s' "$removed"
          fi

          if [ -n "$changed$removed" ]; then
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 생성 타입 최신성 확인
        # 커밋된 openapi.json으로 openapi.gen.ts를 다시 만들어 커밋된 것과 같은지만
        # 본다. 네트워크를 쓰지 않으므로(운영 BE와의 실제 대조는 openapi-drift-check.yml
        # cron이 담당) 이 게이트는 BE 배포 타이밍과 무관하게 항상 결정론적이다.
        # git diff는 커밋 안 된 새 파일을 못 봐서 git status로 폴더 전체를 본다.
        run: |
          pnpm codegen
          if [ -n "$(git status --porcelain src/shared/api/generated/)" ]; then
            git status --short src/shared/api/generated/
            echo "openapi.json을 바꾸고 pnpm codegen을 안 돌렸습니다."
            exit 1
          fi

      - name: Type check, lint & format check
        run: pnpm check

      - name: Run tests
        run: pnpm test
        env:
          VITE_API_BASE_URL: http://localhost

      - name: Claude 훅 회귀 테스트
        # .claude/hooks/의 가드·감시 훅(bash-guard·edit-guard·deploy-verify·filename-case-check)은
        # 사용자 설정에 등록돼 모든 세션에서 돈다. vitest(src/) 밖이라 따로 node --test로 돌린다.
        run: node --test .claude/hooks/*.test.mjs

      - name: git 훅 회귀 테스트
        # 임시 git 레포에서 이 레포의 lint-staged로 경로 지정 커밋(git commit -- <경로>)을 해, 커밋 직후
        # 인덱스가 prettier 이전 내용으로 남지 않는지 본다(lint-staged 16.2.7에서 MM이 남았다 —
        # docs/plans/2026-10-16-lint-staged-pathspec-index.md, docs/CI-CHECK-GATE.md §9.8).
        run: node --test .husky/scripts/*.test.mjs

      - name: Check docs
        run: pnpm check:docs

      - name: 운영 의존성 보안 감사
        # 운영 번들에 들어가는 의존성(dependencies)에 high 이상 권고가 있으면 막는다. 개발 도구
        # (devDependencies)와 moderate 이하는 막지 않는다(2026-11-12 사용자 결정). 권고 DB가 바뀌면
        # 코드와 무관한 PR도 실패할 수 있어 다른 검사 결과를 먼저 보도록 막는 검사 맨 뒤에 둔다.
        # 지금 고칠 수 없어 빼 둔 권고와 그 이유는 pnpm-workspace.yaml의 auditConfig, 절차는
        # docs/CI-CHECK-GATE.md §7 "자주 하는 수정".
        run: pnpm audit --prod --audit-level=high

      - name: PR 영향 그래프 (정보용 — 실패해도 잡은 통과)
        # 이 PR이 바꾼 src 파일과, import를 따라 거기에 닿는 파일을 Mermaid 그림으로 실행 결과
        # 요약(Step Summary)과 PR 댓글에 붙인다. 리뷰 보조용이라 그림을 못 그려도 잡을 실패시키지
        # 않는다(docs/plans/2026-10-01-dependency-cruiser.md).
        # 댓글은 PR마다 하나다 — 맨 앞 표식 주석으로 이전 댓글을 찾아 갱신하고, 없을 때만 새로
        # 단다. 그림 대상 src 변경이 없는 PR(문서만 바꾼 PR 등)에는 새 댓글을 달지 않는다.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          graph="$RUNNER_TEMP/dep-graph.md"
          comment="$RUNNER_TEMP/dep-graph-comment.md"
          marker='<!-- dep-graph-affected -->'

          node scripts/dep-graph.js --affected "$BASE_SHA" > "$graph"
          cat "$graph" >> "$GITHUB_STEP_SUMMARY"
          { echo "$marker"; cat "$graph"; } > "$comment"

          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment" > /dev/null
          elif grep -q '```mermaid\|^| 슬라이스 |' "$graph"; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
          fi

      - name: Build
        # globals.css의 @theme 토큰이 실제 CSS로 정상 생성되는지 머지 전에 확인한다.
        # 지금까지는 이 확인을 로컬에서 pnpm build 후 dist CSS를 수동 grep하는
        # 방식으로만 해왔다(docs/DESIGN-SYSTEM.md §9 참고) - CI 게이트가 없었다.
        run: pnpm build

      - name: 진입 청크에 zod 없음 확인
        # 진입 청크 경로의 모듈이 zod를 끌어오면 index.html의 modulepreload에 zod-vendor가 오른다.
        # 2026-10-28 첫 로딩 JS에서 뺀 것(docs/PERFORMANCE.md "첫 로딩 JS")이 import 하나로 조용히
        # 되돌아오지 않게 빌드 결과로 확인한다. index.html만 보므로 지연 청크(목록 페이지 등)가
        # zod를 끌어오는 것은 못 잡는다.
        run: |
          if grep -q 'zod-vendor' dist/index.html; then
            grep -o '[^"]*zod-vendor[^"]*' dist/index.html
            echo "첫 로딩(index.html)에 zod-vendor가 실렸습니다. 첫 화면 경로에서 zod를 import하는 모듈을 찾으세요."
            exit 1
          fi

      - name: 운영 번들에 dayjs 한국어 로케일 있음 확인
        # date.util.ts의 import 'dayjs/locale/ko'는 값을 쓰지 않고 실행만 시키는 import다.
        # vite.config.ts의 treeshake.moduleSideEffects가 이 모듈을 부작용 없음으로 보면 번들에서
        # 통째로 빠지고 dayjs.locale('ko')가 조용히 영어로 남는다(2026-11-12 발견, 그때까지 운영
        # 번들에 로케일이 없었다). 지금 설정은 우리 src만 부작용 없음으로 봐서 패키지인 이 모듈은 남는다 —
        # 설정을 다시 패키지까지 넓히면 이 검사가 잡는다. 단위 테스트는 트리셰이킹을 하지 않고 e2e는 dev 서버를 써서
        # 빌드 결과로만 볼 수 있다. '일요일_월요일'은 dayjs 로케일 파일의 요일 목록 형식이다.
        run: |
          if ! grep -rqF '일요일_월요일' dist/assets/js; then
            echo "운영 번들에 dayjs 한국어 로케일이 없습니다. vite.config.ts의 treeshake.moduleSideEffects가 src 밖(node_modules) 모듈에 false를 돌려주지 않는지 확인하세요."
            exit 1
          fi

      - name: Build Storybook
        # e2e job의 pnpm test:storybook은 dev 서버를 띄워 스토리를 테스트하는
        # 것이라, 프로덕션 정적 빌드에서만 드러나는 실패(예: 자산 경로 문제)를
        # 잡지 못한다. 공개 배포(deploy-storybook.yml) 대상이 되는 산출물이므로
        # PR 단계에서 빌드가 되는지 확인한다.
        run: pnpm build-storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # "바뀐 e2e 스펙 반복 실행"이 PR 병합 커밋의 첫 부모(base)와 비교한다(HEAD^1)
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Run Storybook a11y tests
        # addon-vitest가 storybookScript(vitest.config.ts)로 Storybook 서버를
        # 직접 띄우므로 별도 기동 스텝이 필요 없다. 이 job이 이미 설치한
        # Playwright 브라우저(위 스텝)를 그대로 재사용한다 - 새 job으로 분리하면
        # 브라우저 설치가 중복된다.
        # 테스트 도중 Vite가 의존성을 뒤늦게 다시 최적화하면("optimized dependencies changed")
        # 페이지가 리로드돼 실행 중인 스토리가 타이밍에 따라 실패한다. 이번 run이 통과했더라도
        # 이 로그가 찍히면 실패시켜, 원인을 들여온 PR에서 바로 잡는다(docs/DESIGN-SYSTEM.md §10).
        run: |
          set +e
          pnpm test:storybook 2>&1 | tee storybook-test.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -q 'optimized dependencies changed' storybook-test.log; then
            echo "::error title=Storybook 테스트 중 의존성 재최적화::테스트 도중 Vite가 의존성을 다시 최적화해 페이지가 리로드됐다. 없는 경로 요청이 SPA 폴백으로 index.html을 받아 앱 진입점까지 변환하지 않았는지 먼저 확인하고, 스토리가 실제로 쓰는 의존성이면 vitest.config.ts storybook 프로젝트의 optimizeDeps.include에 추가한다(docs/DESIGN-SYSTEM.md §10)."
            sed -E 's/\x1b\[[0-9;]*m//g' storybook-test.log | grep -E 'new dependenc(y|ies) optimized' || true
            exit 1
          fi

          exit "$status"

      - name: 바뀐 e2e 스펙 반복 실행
        # "Run e2e tests"는 재시도로만 통과해도 실패로 치지만(failOnFlakyTests) 한 번만 돌아서, 가끔만
        # 실패하는 새 테스트는 그대로 통과해 main에 들어온다 - #450의 auth-tab-sync 2건이 병합 뒤
        # 25회 중 3회 실패했다. PR이 직접 추가·수정한 스펙만 재시도 없이 10번씩 돌려 병합 전에
        # 잡는다. Playwright --only-changed는 바뀐 파일을 import하는 스펙까지 고르는데, 거의 모든
        # 스펙이 texts.ts를 import해 문구 하나만 바뀌어도 전체를 반복하게 되므로 쓰지 않는다
        # (docs/TESTING.md "CI 연동").
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t specs < <(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'e2e/*.spec.ts')

          if [ ${#specs[@]} -eq 0 ]; then
            echo "바뀐 e2e 스펙이 없어 건너뛴다."
            exit 0
          fi

          printf '반복 실행할 스펙:\n'
          printf '  %s\n' "${specs[@]}"
          pnpm test:e2e "${specs[@]}" --repeat-each=10 --retries=0

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    # 공개 페이지만 잰다 - 로그인 필요 페이지(pnpm perf:lh:auth)는 테스트 계정 비밀번호를
    # secret으로 등록하는 별도 절차가 필요해 로컬 수동 실행용으로만 남겨뒀다
    # (docs/PERFORMANCE.md 참고). Best Practices만 error(0.9 미만이면 이 job이 실패)이고 성능
    # 지표는 warn이다 - 이 job은 필수 체크가 아니라 실패해도 병합은 막히지 않는다. 근거는
    # docs/DECISIONS.md 2026-09-26 "Lighthouse CI" 항목과 docs/plans/2026-10-26-lighthouse-best-practices.md.
    runs-on: ubuntu-latest
    # pull-requests: write는 아래 "결과 보고" 스텝이 PR 댓글을 달고 갱신하는 데 필요하다(mutation job과 같은 이유).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # 로컬 .env와 같은 운영 API를 CloudFront 경유로 가리킨다. Lambda Function URL을
          # 직접 부르면 OAC 잠금(2026-09-29) 이후 403이라 데이터 없는 화면을 측정하게 된다.
          # BE CORS 허용 목록에 http://localhost:*가 있어 localhost 프리뷰에서도 정상 동작한다
          # (2026-10-02 curl preflight로 확인).
          VITE_API_BASE_URL: https://linksphere.click/api
          # 위 API가 FE와 교차 출처라 connect-src 'self'인 CSP를 주입하면 모든 API
          # 호출이 막혀 빈 화면을 측정하게 된다(scripts/inject-csp.js 주석 참고) -
          # 실제 배포는 같은 출처(/api)만 쓰므로 이 문제가 없다.
          SKIP_CSP_INJECTION: '1'

      - name: Run Lighthouse CI
        run: pnpm perf:lh

      - name: 결과 보고 (Step Summary·PR 댓글)
        # 경고·실패가 job 원본 로그에만 있어 Best Practices가 떨어져도 아무도 못 봤다(2026-10-26). 점수 표를
        # Step Summary와 PR 댓글에 싣는다. 댓글은 PR마다 하나다 — 맨 앞 표식 주석으로 이전 댓글을 찾아
        # 갱신하고, 없으면 새로 단다(mutation job의 같은 이름 스텝과 같은 형태). 기준 미달로 위 스텝이
        # 실패해도 결과를 보여야 하므로 always()다. 수동 실행(workflow_dispatch)은 PR이 없어 Summary만 쓴다.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report="$RUNNER_TEMP/lighthouse-report.md"
          comment="$RUNNER_TEMP/lighthouse-comment.md"
          marker='<!-- lighthouse-report -->'

          node scripts/lighthouse-report.js > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi

          { echo "$marker"; cat "$report"; } > "$comment"

          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
          fi

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # .lighthouseci/는 숨김 폴더라 기본값(false)이면 통째로 빠져 "No files were found"로 끝났다
          # (2026-10-16·10-25 run 확인 — 그동안 리포트가 한 번도 보관되지 않았다).
          include-hidden-files: true
          retention-days: 30

  mutation:
    # 정보용 — 이 PR이 바꾼 로직 파일(.ts)과, 테스트만 바뀐 경우 같은 폴더의 짝 원본에
    # 뮤테이션 테스트(StrykerJS)를 돌려 살아남은 뮤턴트를 Step Summary와 PR 댓글로 보인다.
    # 점수와 관계없이 통과하고(stryker.config.json의 thresholds.break: null), 실행이 실패해도
    # 잡은 통과한다. 근거는 docs/plans/2026-10-13-mutation-ci-report.md, 보고 읽는 법은
    # docs/TESTING.md "뮤테이션 테스트".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pull-requests: write는 결과 댓글을 달고 갱신하는 데 필요하다("PR 영향 그래프" 스텝과 같은 이유).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 이 잡은 저장소의 테스트를 실행하고 PR 쓰기 토큰을 받는다. 뒤 스텝이 git 인증을 쓰지 않으니
          # 토큰을 파일로 남기지 않는다(docs/plans/2026-11-06-mutation-loop-l2.md).
          persist-credentials: false

      - name: 대상 파일 고르기
        # Node 내장 모듈만 쓰는 스크립트라 러너에 깔린 Node로 돌린다. pnpm·Node 설정은 대상이 있을
        # 때만 한다 — setup-node가 pnpm 캐시를 켠 채 install 없이 끝나면, 저장할 캐시 경로가 없어
        # 사후 정리 단계가 실패한다(2026-10-13 이 PR 첫 실행에서 실측).
        id: targets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/mutation-report.js --targets "$BASE_SHA" > "$RUNNER_TEMP/mutation-targets.txt"
          cat "$RUNNER_TEMP/mutation-targets.txt"
          echo "files=$(paste -sd, "$RUNNER_TEMP/mutation-targets.txt")" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.targets.outputs.files != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        if: steps.targets.outputs.files != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.targets.outputs.files != ''
        run: pnpm install --frozen-lockfile

      - name: 뮤테이션 테스트 (정보용 — 실패해도 잡은 통과)
        if: steps.targets.outputs.files != ''
        continue-on-error: true
        # job 제한(20분)보다 짧게 둬, 오래 걸려도 아래 보고 스텝이 돌 시간을 남긴다.
        timeout-minutes: 15
        env:
          VITE_API_BASE_URL: http://localhost
          TARGETS: ${{ steps.targets.outputs.files }}
        run: pnpm test:mutation --mutate "$TARGETS"

      - name: 결과 보고 (Step Summary·PR 댓글)
        # 댓글은 PR마다 하나다 — 맨 앞 표식 주석으로 이전 댓글을 찾아 갱신하고, 없으면 대상이 있을
        # 때만 새로 단다. 나중 push로 대상이 사라지면 기존 댓글을 "대상 없음"으로 바꾼다.
        # 대상 고르기 자체가 실패했으면 대상 목록을 믿을 수 없으니 보고하지 않는다.
        if: always() && steps.targets.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_TARGETS: ${{ steps.targets.outputs.files != '' }}
        run: |
          report="$RUNNER_TEMP/mutation-report.md"
          comment="$RUNNER_TEMP/mutation-comment.md"
          marker='<!-- mutation-report -->'

          node scripts/mutation-report.js --report reports/mutation/mutation.json "$RUNNER_TEMP/mutation-targets.txt" > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          { echo "$marker"; cat "$report"; } > "$comment"

          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment" > /dev/null
          elif [ "$HAS_TARGETS" = 'true' ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
          fi
