# 워크플로의 액션은 커밋 SHA로 고정해 둔다(태그 바꿔치기 대비). 고정한 SHA는 저절로 안 올라가므로
# 이 봇이 새 버전을 한 달에 한 번, PR 하나로 묶어 올린다. 근거와 PR 처리 절차는
# docs/DEPLOY.md "액션 버전 관리" 참고.
# npm 패키지도 한 달에 한 번 minor·patch만 PR 하나로 묶어 올린다. 메이저는 마이그레이션이라 따로
# 계획한다. 근거와 PR 처리 절차는 docs/DEPLOY.md "npm 패키지 업데이트" 참고.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # allow의 update-types는 버전 업데이트에만 걸리고 보안 업데이트에는 걸리지 않는다(Dependabot
    # options reference "update-types (allow)"). ignore로 메이저를 막으면 보안 업데이트까지 막힌다.
    # dependency-type을 비우면 Dependabot이 all로 읽어 간접 의존성까지 하나씩 검사한다. 2026-11-12 첫 run이
    # 그러다 55분 만에 취소돼 PR이 열리지 않았다(docs/DEPLOY.md "npm 패키지 업데이트").
    allow:
      - dependency-name: '*'
        dependency-type: direct
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope
