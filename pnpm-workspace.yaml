# pnpm 설정 파일. pnpm 문서는 설정을 이 파일에 두라고 하고, 최신 pnpm은 package.json의 `pnpm` 필드를 읽지 않는다
# (https://pnpm.io/package_json).
#
# 워크스페이스: 루트(이 앱)는 늘 들어가고, packages/ 아래 패키지가 함께 든다(2026-11-20 분리 리허설,
# docs/DESIGN-SYSTEM-PRINCIPLES.md §1.5). packages/ui는 공용 UI 패키지 `@link-sphere/ui`이고 이 앱이
# `workspace:*`로 가져다 쓴다. 루트에서 `pnpm add`는 지금처럼 루트에 더해지고(2026-11-20 pnpm 10.20.0에서
# -w 없이 확인), 패키지에 더할 때는 `pnpm --filter @link-sphere/ui add <패키지>`를 쓴다.
packages:
  - 'packages/*'

# 부모가 버전 범위를 막아 락 갱신으로 안 풀리는 개발 의존성 알림을 올리는 자리. 항목마다 이유와 지울 때를
# 적는다. 절차는 docs/DEPLOY.md "npm 패키지 업데이트"의 "간접 의존성 알림".
overrides:
  # Dependabot #132(GHSA-g3hv-75wg-m249) — minimatch 10.x는 고친 버전이 11.0.1부터다.
  # typescript-estree·glob 13(`^10.2.2`)과 stryker(`~10.2.4`)가 10 계열에 묶여 있어 직접 올린다(2026-11-16).
  # 11.0.0 회귀(GHSA-cf2h-pxjq-68xw)는 11.0.7에서 고쳐 `^11.0.7`로 건다. 위 세 부모가 11을 받으면 지운다.
  'minimatch@>=10 <11': '^11.0.7'
  # Dependabot #39(GHSA-q8mj-m7cp-5q26) — qs 6.15.1 이하. @stryker-mutator/core가 쓰는 typed-rest-client 2.3.1(npm 최신)이
  # qs를 6.15.1로 정확히 고정한다(2026-11-16 `npm view`). typed-rest-client가 qs를 올리면 지운다.
  'qs@<=6.15.1': '^6.16.2'

# CI 운영 의존성 감사(`pnpm audit --prod --audit-level=high`, .github/workflows/ci.yml)에서 뺄 권고.
# 고친 버전으로 지금 올릴 수 없고 운영 사용자에게 닿지 않는 것만 넣는다. 항목마다 이유와 지울 때를
# 적는다. 절차는 docs/CI-CHECK-GATE.md §7 "자주 하는 수정".
auditConfig:
  ignoreGhsas:
    # @grpc/grpc-js <1.13.6 — gRPC 서버가 클라이언트 인증서를 검사할 때 생기는 문제. 앱이 쓰지 않는
    # Firestore(@firebase/firestore가 ~1.9.0으로 묶음)를 따라 설치될 뿐이고, 앱은 firebase/app·
    # firebase/messaging만 import해 빌드 결과물에 grpc 코드가 없다(2026-11-12 dist 검색 0건).
    # firebase를 올려도 풀리지 않는다 — 최신 firebase 13.3.0이 쓰는 @firebase/firestore 4.20.0도
    # @grpc/grpc-js ~1.9.0으로 묶는다(2026-11-15 `npm view`). @firebase/firestore가 그 핀을 풀어
    # 1.13.6 이상이 깔리면 지운다.
    - GHSA-m9gg-hp2v-232j
